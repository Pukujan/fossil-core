name: Shared-chat capture mutation assurance

on:
  pull_request:
    paths:
      - "src/fossil_core/application/ingest/shared_chat_capture.py"
      - "scripts/ingest_shared_chat_reconstructions.py"
      - "tests/test_shared_chat_capture_completeness.py"
      - "tests/test_shared_chat_capture_faults.py"
      - "tests/test_shared_chat_capture_accounting.py"
      - "tests/test_shared_chat_capture_properties.py"
      - "tests/test_shared_chat_ingestion.py"
      - "scripts/check_mutation_assurance.py"
      - ".github/workflows/mutation-shared-chat-capture.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/fossil_core/application/ingest/shared_chat_capture.py"
      - "scripts/ingest_shared_chat_reconstructions.py"
      - "tests/test_shared_chat_capture_completeness.py"
      - "tests/test_shared_chat_capture_faults.py"
      - "tests/test_shared_chat_capture_accounting.py"
      - "tests/test_shared_chat_capture_properties.py"
      - "tests/test_shared_chat_ingestion.py"
      - "scripts/check_mutation_assurance.py"
      - ".github/workflows/mutation-shared-chat-capture.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  shared-chat-capture:
    runs-on: [self-hosted, gravebuster, fossil-core]
    timeout-minutes: 35
    env:
      FOSSIL_SOFTWARE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact target checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${FOSSIL_SOFTWARE_COMMIT}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mutation toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,mutation,s3]'
          python -m pip check
          mutmut --version
      - name: Configure isolated shared-chat mutation scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          marker = "[tool.mutmut]\n"
          if marker not in text:
              raise SystemExit("missing [tool.mutmut] block")
          prefix, _old = text.split(marker, 1)
          scoped = '''[tool.mutmut]
          source_paths = ["src/fossil_core"]
          only_mutate = ["src/fossil_core/application/ingest/shared_chat_capture.py"]
          also_copy = ["schemas", "examples", "skills", "docs", "scripts"]
          pytest_add_cli_args_test_selection = [
            "tests/test_shared_chat_capture_completeness.py",
            "tests/test_shared_chat_capture_faults.py",
            "tests/test_shared_chat_capture_accounting.py",
            "tests/test_shared_chat_capture_properties.py",
            "tests/test_shared_chat_ingestion.py",
          ]
          '''
          path.write_text(prefix + scoped, encoding="utf-8")
          PY
      - name: Run bounded shared-chat capture mutants
        shell: bash
        run: |
          rm -rf mutants
          mutmut run
          mkdir -p build/assurance
          mutmut results | tee build/assurance/mutation-shared-chat-capture-survivors.txt
          mutmut export-cicd-stats
      - name: Show surviving mutant diffs
        shell: bash
        run: |
          awk -F': ' '/: (survived|no tests)$/ {gsub(/^[[:space:]]+/, "", $1); print $1}' \
            build/assurance/mutation-shared-chat-capture-survivors.txt \
          | while IFS= read -r mutant; do
              echo "::group::${mutant}"
              mutmut show "${mutant}"
              echo "::endgroup::"
            done
      - name: Enforce shared-chat mutation strength
        run: |
          python scripts/check_mutation_assurance.py \
            mutants/mutmut-cicd-stats.json \
            --scope shared-chat-capture \
            --minimum-score 84 \
            --maximum-survivors 90 \
            --maximum-no-tests 0 \
            --receipt build/assurance/mutation-shared-chat-capture.json
      - name: Emit compact mutation receipt
        shell: bash
        run: |
          {
            echo "## Shared-chat capture mutation receipt"
            echo '```json'
            cat build/assurance/mutation-shared-chat-capture.json
            echo '```'
            echo "### Surviving mutants"
            echo '```text'
            cat build/assurance/mutation-shared-chat-capture-survivors.txt
            echo '```'
            echo "- issue: #247"
            echo "- coordination: #94"
            echo "- property: FOSSIL-PROP-CAPTURE-COMPLETENESS-001"
            echo "- tool: mutmut source pinned at dc58270d5234752e22247f814431750eafcf6e5f"
            echo "- mutable source: src/fossil_core/application/ingest/shared_chat_capture.py only"
            echo "- bounded tests: shared-chat completeness, fault, accounting, property, and ingestion oracles"
            echo "- gate: score >= 84%; survivors <= 90; no-test mutants = 0"
            echo "- security: secretless; contents:read"
          } >> "$GITHUB_STEP_SUMMARY"
